<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - PixelCraft Agency</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <a href="index.html" class="logo">Pixel<span>Craft</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <!-- Contact Form Content -->
  <div class="container">
    <h2 class="section-title">Get In Touch</h2>
    <p class="section-subtitle">Send us your project details and we will reply quickly.</p>

    <div class="contact-box">
      <form>
        <div class="form-group">
          <label>Your Name</label>
          <input type="text" placeholder="Enter your name" required>
        </div>
        <div class="form-group">
          <label>Email / WhatsApp</label>
          <input type="text" placeholder="Enter your email or phone number" required>
        </div>
        <div class="form-group">
          <label>Project Details</label>
          <textarea placeholder="Tell us about what you want to build..." required></textarea>
        </div>
        <button type="submit" class="btn" style="width: 100%; border: none; cursor: pointer;">Send Message</button>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 PixelCraft Agency. All rights reserved.</p>
  </footer>

</body>
</html>
